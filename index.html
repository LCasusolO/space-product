    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #ffffff;
        }
        
        #chart-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        
        #chart-container:active {
            cursor: grabbing;
        }

        .node {
            stroke-width: 0.5px;
            transition: stroke-width 0.2s, stroke 0.2s;
        }

        .node:hover {
            stroke: #111;
            stroke-width: 2px;
            cursor: pointer;
        }

        .node-inactive {
            fill: #e5e5e5;
            stroke: #a3a3a3;
        }

        .category-label {
            font-size: 11px;
            font-weight: 700;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
        }

        #tooltip {
            position: absolute;
            opacity: 0;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: opacity 0.2s;
            z-index: 100;
            max-width: 280px;
        }
        
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.8s ease-out;
        }
    </style>

        function traducirProducto(nombreIngles, codigoHS) {
            if (diccionarioCodigos[codigoHS]) return diccionarioCodigos[codigoHS];
            let nombreTraducido = nombreIngles.toLowerCase();
            for (let [ingles, espanol] of Object.entries(palabrasClave)) {
                const regex = new RegExp(`\\b${ingles}\\b`, 'gi');
                nombreTraducido = nombreTraducido.replace(regex, espanol);
            }
            return nombreTraducido.charAt(0).toUpperCase() + nombreTraducido.slice(1);
        }

        const formatMoney = (value) => {
            if (value >= 1e9) return `$${(value / 1e9).toFixed(1)}B`;
            if (value >= 1e6) return `$${(value / 1e6).toFixed(1)}M`;
            if (value >= 1e3) return `$${(value / 1e3).toFixed(1)}K`;
            return `$${value.toFixed(0)}`;
        };

        document.addEventListener("DOMContentLoaded", () => {
            requestAnimationFrame(() => {
                setTimeout(() => {
                    processDataAndDraw(csvDataString);
                }, 100);
            });
        });

        function processDataAndDraw(csvText) {
            const rawData = d3.csvParse(csvText);
            
            let totalExportValuePeru = 0;
            const nodes = [];

            // Si hay muy pocos datos, muestra la alerta
            if(rawData.length < 50) {
                document.getElementById('data-warning').style.display = 'block';
            }

            rawData.forEach(d => {
                const countryTrade = parseFloat(d["Country Trade"]) || 0; 
                const worldTrade = parseFloat(d["World Trade"]) || 0;     
                const rca = parseFloat(d["Revealed Comparative Advantage (RCA)"]) || 0;
                
                totalExportValuePeru += countryTrade;

                const isActive = rca >= 1.0; 
                const sectorKey = d["Sector"] || "Other";
                const sectorES = sectorNombresES[sectorKey] || "Otros";
                const color = sectorColors[sectorKey] || sectorColors["Other"];

                nodes.push({
                    id: d["Code"],
                    nameOriginal: d["Name"],
                    nameES: traducirProducto(d["Name"], d["Code"]),
                    sectorKey: sectorKey,
                    sector: sectorES,
                    countryTrade: countryTrade,
                    worldTrade: worldTrade,
                    rca: rca,
                    isActive: isActive,
                    color: color
                });
            });

            document.getElementById('total-value-display').innerText = formatMoney(totalExportValuePeru);
            
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.style.display = 'none', 800);

            drawProductSpace(nodes);
        }

        function drawProductSpace(nodesData) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const container = d3.select("#chart-container");
            container.selectAll("*").remove(); 
            const tooltip = d3.select("#tooltip");

            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("viewBox", [0, 0, width, height]);

            const g = svg.append("g");

            const zoom = d3.zoom()
                .scaleExtent([0.3, 8])
                .on("zoom", (event) => g.attr("transform", event.transform));
            svg.call(zoom);

            const maxWorldTrade = d3.max(nodesData, d => d.worldTrade);
            const radiusScale = d3.scaleSqrt()
                .domain([0, maxWorldTrade || 1])
                .range([3, 45]); 

            const sectorCenters = {
                "Minerals": { cx: width * 0.45, cy: height * 0.3 },
                "Chemicals": { cx: width * 0.25, cy: height * 0.4 },
                "Metals": { cx: width * 0.35, cy: height * 0.5 },
                "Electronics": { cx: width * 0.3, cy: height * 0.7 },
                "Machinery": { cx: width * 0.4, cy: height * 0.6 },
                "Construction": { cx: width * 0.6, cy: height * 0.5 },
                "Stone": { cx: width * 0.6, cy: height * 0.5 },
                "Textiles": { cx: width * 0.65, cy: height * 0.7 },
                "Agriculture": { cx: width * 0.75, cy: height * 0.4 },
                "Vehicles": { cx: width * 0.85, cy: height * 0.75 },
                "Other": { cx: width * 0.5, cy: height * 0.5 }
            };

            nodesData.forEach(n => {
                n.r = radiusScale(n.worldTrade) || 3;
                const center = sectorCenters[n.sectorKey] || sectorCenters["Other"];
                n.targetX = center.cx;
                n.targetY = center.cy;
                n.x = center.cx + (Math.random() - 0.5) * 200;
                n.y = center.cy + (Math.random() - 0.5) * 200;
            });

            const links = [];
            const sectors = Array.from(new Set(nodesData.map(d => d.sectorKey)));
            
            sectors.forEach(sector => {
                const sectorNodes = nodesData.filter(n => n.sectorKey === sector);
                for (let i = 0; i < sectorNodes.length - 1; i++) {
                    links.push({ source: sectorNodes[i].id, target: sectorNodes[i+1].id });
                    if (Math.random() > 0.3 && i < sectorNodes.length - 2) {
                        links.push({ source: sectorNodes[i].id, target: sectorNodes[i+2].id });
                    }
                }
            });

            const simulation = d3.forceSimulation(nodesData)
                .force("link", d3.forceLink(links).id(d => d.id).distance(30).strength(0.8))
                .force("charge", d3.forceManyBody().strength(d => -d.r * 2.5)) 
                .force("x", d3.forceX(d => d.targetX).strength(0.08)) 
                .force("y", d3.forceY(d => d.targetY).strength(0.08))
                .force("collide", d3.forceCollide().radius(d => d.r + 2).iterations(3)); 

            for (let i = 0; i < 200; ++i) simulation.tick();

            g.selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y)
                .attr("stroke", "#e2e8f0")
                .attr("stroke-width", 0.8)
                .attr("opacity", 0.7);

            nodesData.sort((a, b) => (a.isActive === b.isActive) ? b.r - a.r : a.isActive ? 1 : -1);

            g.selectAll("circle")
                .data(nodesData)
                .enter().append("circle")
                .attr("cx", d => d.x)
                .attr("cy", d => d.y)
                .attr("r", d => d.r)
                .attr("fill", d => d.isActive ? d.color : "#e5e5e5")
                .attr("stroke", d => d.isActive ? d3.color(d.color).darker(0.7) : "#a3a3a3")
                .attr("class", d => d.isActive ? "node" : "node node-inactive")
                
                .on("mouseover", function(event, d) {
                    d3.select(this)
                      .attr("stroke", "#0f172a")
                      .attr("stroke-width", 2.5);

                    tooltip.transition().duration(200).style("opacity", 1);
                    tooltip.html(`
                        <div class="font-bold text-xs uppercase mb-1 tracking-wider" style="color:${d.color}">${d.sector}</div>
                        <div class="font-bold text-[15px] text-gray-900 leading-tight mb-3 border-b pb-2">${d.nameES}</div>
                        <div class="space-y-1.5 text-sm text-gray-700">
                            <div class="flex justify-between">
                                <span class="text-gray-500">Comercio Mundial:</span> 
                                <span class="font-semibold">${formatMoney(d.worldTrade)}</span>
                            </div>
                            <div class="flex justify-between ${d.isActive ? 'text-blue-700 bg-blue-50 -mx-2 px-2 py-0.5 rounded' : ''}">
                                <span class="${d.isActive ? 'font-medium' : 'text-gray-500'}">Exportación Perú:</span> 
                                <span class="font-bold">${formatMoney(d.countryTrade)}</span>
                            </div>
                            <div class="flex justify-between mt-2 pt-2 border-t text-xs">
                                <span class="text-gray-500" title="Ventaja Comparativa Revelada">VCR (RCA):</span> 
                                <span class="font-mono ${d.isActive ? 'text-green-600 font-bold' : 'text-gray-400'}">${d.rca.toFixed(2)}</span>
                            </div>
                        </div>
                    `)
                    .style("left", (event.pageX + 20) + "px")
                    .style("top", (event.pageY - 40) + "px");
                })
                .on("mouseout", function(event, d) {
                    d3.select(this)
                      .attr("stroke", d.isActive ? d3.color(d.color).darker(0.7) : "#a3a3a3")
                      .attr("stroke-width", 0.5);
                    tooltip.transition().duration(200).style("opacity", 0);
                });

            const activeSectorsKeys = Array.from(new Set(nodesData.map(d => d.sectorKey)));
            g.selectAll("text.category-label")
                .data(activeSectorsKeys)
                .enter()
                .append("text")
                .attr("class", "category-label")
                .attr("x", d => sectorCenters[d] ? sectorCenters[d].cx : width/2)
                .attr("y", d => sectorCenters[d] ? sectorCenters[d].cy : height/2)
                .text(d => sectorNombresES[d] || d);

            svg.call(zoom.transform, d3.zoomIdentity.translate(width*0.05, height*0.05).scale(0.9));

            window.addEventListener('resize', () => {
                svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
            });
        }
    </script>
</body>
</html>
